name: Release

# 1. On every push to main, release-please maintains a "chore(main): release x.y.z"
#    pull request that bumps package.json and updates CHANGELOG.md from the
#    Conventional Commit history.
# 2. Merging that pull request tags vX.Y.Z and creates the GitHub release; the
#    publish job then packages the VSIX and ships it to the marketplaces.
# A manual run (workflow_dispatch) re-packages the selected ref and, unless
# dry_run is set, (re)publishes it — useful for retrying a failed publish.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: package and verify only, do not publish'
        type: boolean
        default: true
      marketplace:
        description: 'Marketplace(s) to publish to'
        type: choice
        options: [all, vscode, openvsx]
        default: all

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT lets CI run on the release PR; GITHUB_TOKEN works but PRs it opens skip CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Package & publish
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Marketplace secrets can live on this environment, which only main can deploy to.
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=sebschre.openspec-vscode-extension
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      MARKETPLACE: ${{ inputs.marketplace || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck, test & validate specs
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run validate:specs

      - name: Package VSIX
        id: vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="openspec-vscode-extension-${VERSION}.vsix"
          pnpm run package --out "$FILE"
          pnpm run verify:vsix "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-package
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error

      - name: Attach VSIX to GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vsix.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.vsix.outputs.file }}" --clobber
          else
            echo "::notice::No GitHub release $TAG exists; skipping attachment."
          fi

      - name: Publish to VS Code Marketplace
        if: env.DRY_RUN != 'true' && (env.MARKETPLACE == 'all' || env.MARKETPLACE == 'vscode')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not configured."
            exit 1
          fi
          pnpm exec vsce publish --packagePath "${{ steps.vsix.outputs.file }}" --skip-duplicate

      - name: Publish to Open VSX
        if: env.DRY_RUN != 'true' && (env.MARKETPLACE == 'all' || env.MARKETPLACE == 'openvsx')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::Secret OVSX_PAT is not configured; skipping Open VSX."
            exit 0
          fi
          pnpm dlx ovsx@1.3.0 publish "${{ steps.vsix.outputs.file }}" --skip-duplicate
