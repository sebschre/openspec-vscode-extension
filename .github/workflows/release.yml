name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release and verify packaging without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, Package & Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      # semantic-release dry runs skip prepare, so exercise packaging explicitly.
      - name: Verify packaging for dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run package:release

      - name: Preview release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run release -- --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retain VSIX for inspection and recovery
        if: always() && hashFiles('artifacts/*.vsix') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix-${{ github.sha }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 30
