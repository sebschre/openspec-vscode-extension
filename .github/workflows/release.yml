name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package and verify only, do not publish to marketplace)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build extension bundle
        run: npm run build

      - name: Package extension (VSIX)
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Locate VSIX artifact
        id: vsix
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "file=${VSIX_FILE}" >> "$GITHUB_OUTPUT"
          echo "Found VSIX package: ${VSIX_FILE}"

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not set. Please configure VSCE_PAT in repository secrets."
            exit 1
          fi
          npx @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.file }}" -p "$VSCE_PAT"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true
