name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  verify:
    name: Typecheck, test & package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Validate OpenSpec specs and changes
        run: npm run validate:specs

      - name: Package VSIX (marketplace README, production build)
        run: npm run package -- --out openspec-vscode-extension.vsix

      - name: Verify VSIX contents
        run: npm run verify:vsix -- openspec-vscode-extension.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ github.sha }}
          path: openspec-vscode-extension.vsix
          retention-days: 14
          if-no-files-found: error
