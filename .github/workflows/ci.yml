name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  verify:
    name: Typecheck, test & package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Validate OpenSpec specs and changes
        run: pnpm run validate:specs

      - name: Package VSIX (marketplace README, production build)
        run: pnpm run package --out openspec-vscode-extension.vsix

      - name: Verify VSIX contents
        run: pnpm run verify:vsix openspec-vscode-extension.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: openspec-vscode-extension.vsix
          retention-days: 14
          if-no-files-found: error
