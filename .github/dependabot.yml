version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
