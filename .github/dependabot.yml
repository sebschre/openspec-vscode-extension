version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major upgrades (e.g. preact, js-yaml, vsce) need a deliberate migration; do them by hand.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Type definitions must match the Node.js runtime bundled with VS Code (see engines.vscode).
      - dependency-name: '@types/node'
        versions: ['>=23']
      # @types/vscode must not exceed the minimum supported VS Code version in engines.vscode.
      - dependency-name: '@types/vscode'
